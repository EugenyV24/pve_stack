# ⚠️ WARNING: This is a TEMPLATE configuration file.
# NEVER use this file directly in production!
# Replace all {{ VARIABLE_NAME }} placeholders with secure, unique values.
# Generate secrets using: openssl rand -hex 64
# Or use the authelia crypto tool: docker run authelia/authelia:latest authelia crypto hash generate argon2

server:
  address: 'tcp://:9091/'

log:
  level: info

theme: dark

identity_validation:
  reset_password:
    jwt_secret: "{{ AUTHELIA_JWT_SECRET }}" # Min 64 chars random string

totp:
  issuer: "{{ DOMAIN_NAME }}" # e.g., example.com

authentication_backend:
  file:
    path: /config/users_database.yml
    password:
      algorithm: argon2id
      iterations: 3
      salt_length: 16
      parallelism: 4
      memory: 65536

access_control:
  default_policy: deny
  rules:
    - domain: 'authelia.{{ DOMAIN_NAME }}'
      policy: bypass
    - domain: 'grafana.{{ DOMAIN_NAME }}'
      policy: two_factor
    - domain: 'prometheus.{{ DOMAIN_NAME }}'
      policy: two_factor
    - domain: 'pve.{{ DOMAIN_NAME }}'
      policy: two_factor

session:
  name: authelia_session
  secret: "{{ AUTHELIA_SESSION_SECRET }}" # Min 64 chars random string
  expiration: 1h
  inactivity: 5m
  cookies:
    - domain: '{{ COOKIE_DOMAIN }}' # e.g., home.example.com
      authelia_url: 'https://authelia.{{ DOMAIN_NAME }}'
      default_redirection_url: 'https://grafana.{{ DOMAIN_NAME }}'

redis:
  host: authelia-redis
  port: 6379
  password: "{{ REDIS_AUTH_PASSWORD }}" # Strong unique password

regulation:
  max_retries: 3
  find_time: 120
  ban_time: 300

storage:
  encryption_key: "{{ AUTHELIA_STORAGE_ENCRYPTION_KEY }}" # Min 64 chars random string
  local:
    path: /config/db.sqlite3

notifier:
  filesystem:
    filename: /config/notifications.txt
