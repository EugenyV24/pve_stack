server:
  address: 'tcp://:9091/'
log:
  level: info
theme: dark
identity_validation:
  reset_password:
    jwt_secret: unsecure_jwt_secret_change_me
totp:
  issuer: river-server.ru
authentication_backend:
  file:
    path: /config/users_database.yml
    password:
      algorithm: argon2id
      iterations: 3
      salt_length: 16
      parallelism: 4
      memory: 65536
access_control:
  default_policy: deny
  rules:
    - domain: 'authelia.home.river-server.ru'
      policy: bypass
    - domain: 'grafana.home.river-server.ru'
      policy: two_factor
    - domain: 'prometheus.home.river-server.ru'
      policy: two_factor
    - domain: 'pve.home.river-server.ru'
      policy: two_factor
session:
  name: authelia_session
  secret: unsecure_session_secret_change_me
  expiration: 1h
  inactivity: 5m
  cookies:
    - domain: 'home.river-server.ru'
      authelia_url: 'https://authelia.home.river-server.ru'
      default_redirection_url: 'https://grafana.home.river-server.ru'
  redis:
    host: authelia-redis
    port: 6379
    password: SuperSecureRedisAuthPassword
regulation:
  max_retries: 3
  find_time: 120
  ban_time: 300
storage:
  encryption_key: a_very_important_secret_change_me
  local:
    path: /config/db.sqlite3
notifier:
  filesystem:
    filename: /config/notifications.txt
